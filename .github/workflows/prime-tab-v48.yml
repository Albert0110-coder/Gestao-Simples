name: Ajustar aba Gestão Prime v48

on:
  push:
    paths:
      - '.github/workflows/prime-tab-v48.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar título e favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<title>.*?</title>', '<title>Gestão Prime</title>', s, count=1, flags=re.S)
          s=re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/svg+xml" href="assets/prime-favicon-symbol.svg?v=48">', s, count=1)
          s=re.sub(r'app\.js\?v=\d+', 'app.js?v=48', s)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "Prime System"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Define Gestão Prime e favicon apenas com símbolo"
          git push
