name: Aplicar favicon Prime v46

on:
  push:
    paths:
      - '.github/workflows/prime-favicon-v46.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar identidade do navegador
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          icon='<link rel="icon" type="image/png" href="assets/prime-logo-transparent-v42.png?v=46">\n<link rel="apple-touch-icon" href="assets/prime-logo-transparent-v42.png?v=46">\n<meta name="application-name" content="Prime">'
          s=re.sub(r'<link rel="icon"[^>]*>\s*','',s)
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>\s*','',s)
          s=re.sub(r'<meta name="application-name"[^>]*>\s*','',s)
          s=s.replace('<title>Prime</title>', '<title>Prime</title>\n'+icon, 1)
          s=re.sub(r'app\.js\?v=\d+', 'app.js?v=46', s)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "Prime System"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Adiciona favicon Prime e atualiza carregamento v46"
          git push
