name: Ajustar aba Prime v47

on:
  push:
    paths:
      - '.github/workflows/prime-tab-v47.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remover texto visível da aba
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<title>.*?</title>', '<title>&#8203;</title>', s, count=1, flags=re.S)
          s=re.sub(r'app\.js\?v=\d+', 'app.js?v=47', s)
          s=s.replace('prime-logo-transparent-v42.png?v=45','prime-logo-transparent-v42.png?v=47')
          s=s.replace('prime-logo-transparent-v42.png?v=46','prime-logo-transparent-v42.png?v=47')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "Prime System"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Deixa aba apenas com ícone e atualiza v47"
          git push
