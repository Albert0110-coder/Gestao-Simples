<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão Simples">
<title>Gestão Simples</title>
<style>
:root{--b:#090d12;--p:#111821;--p2:#17212c;--l:#263341;--t:#eef4f8;--m:#91a2b2;--g:#5ee0a0;--r:#ff6b7a;--y:#ffc857;--blue:#58b8ff}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}header{position:sticky;top:0;z-index:5;background:#0d131bed;border-bottom:1px solid var(--l);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;backdrop-filter:blur(14px)}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--m);margin-top:3px;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--y);display:inline-block}.dot.ok{background:var(--g)}.dot.bad{background:var(--r)}
main{padding:16px;max-width:850px;margin:auto}.page{display:none}.page.on{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.box{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:14px}.card small{color:var(--m)}.card b{display:block;font-size:20px;margin-top:6px}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}button,input,select,textarea{font:inherit}button{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:11px;padding:11px 13px;font-weight:700}.primary{background:var(--g);color:#062017;border-color:var(--g)}.danger{color:#ffdce1;background:#27151b}.blue{color:#d9efff;background:#16304a;border-color:#285f8b}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button{flex:1}.list{display:grid;gap:9px}.row{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:12px}.rowtop{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--m);font-size:12px}.total{font-weight:800}.pill{font-size:10px;border:1px solid var(--l);border-radius:999px;padding:4px 7px}.empty{text-align:center;color:var(--m);padding:26px}.modal{position:fixed;inset:0;display:none;z-index:20;background:#000b;align-items:flex-end}.modal.on{display:flex}.sheet{background:var(--p);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--l);padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 14px}.grid{display:grid;gap:10px}.grid2{grid-template-columns:1fr 1fr}label{font-size:11px;color:var(--m);font-weight:700}input,select,textarea{width:100%;margin-top:5px;background:#0d141c;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:11px}textarea{min-height:72px}.items{display:grid;gap:8px;margin:12px 0}.item{border:1px solid var(--l);border-radius:12px;padding:10px}.itemgrid{display:grid;grid-template-columns:1fr 90px;gap:8px}.item-actions{display:flex;gap:8px;margin-top:8px}.item-actions button{padding:7px 9px;font-size:12px}.sheetfoot{position:sticky;bottom:0;background:var(--p);padding-top:12px;display:flex;gap:8px}.sheetfoot button{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);background:#0d131bf2;border-top:1px solid var(--l);padding:7px 5px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{border:0;background:transparent;padding:8px 2px;font-size:10px;color:var(--m)}.nav button.on{color:var(--g)}
.auth{position:fixed;inset:0;z-index:100;background:var(--b);display:none;place-items:center;padding:20px}.auth.on{display:grid}.authcard{width:min(420px,100%);background:var(--p);border:1px solid var(--l);border-radius:20px;padding:22px}.authlogo{width:54px;height:54px;border-radius:15px;background:var(--g);color:#062017;display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:14px}.auth h2{margin:0 0 5px}.auth p{color:var(--m);font-size:13px;line-height:1.5}.auth .grid{margin-top:16px}.authmsg{font-size:12px;margin-top:10px;color:var(--y);min-height:17px}.authactions{display:flex;gap:8px;margin-top:12px}.authactions button{flex:1}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}.sheet{max-width:700px;margin:auto;border-radius:20px;margin-bottom:20px}.modal{align-items:center}.nav{left:50%;transform:translateX(-50%);max-width:700px;border:1px solid var(--l);border-radius:16px 16px 0 0}}
</style>
</head>
<body>
<header><h1 id="pageTitle">Painel</h1><div class="sub"><span id="syncDot" class="dot"></span><span id="syncText">Aguardando login</span></div></header>
<main>
<section id="dash" class="page on">
<div class="cards"><div class="card"><small>Vendas</small><b class="g" id="kSales">R$ 0,00</b></div><div class="card"><small>Compras</small><b class="r" id="kBuy">R$ 0,00</b></div><div class="card"><small>Resultado</small><b id="kResult">R$ 0,00</b></div><div class="card"><small>Pendências</small><b class="y" id="kPending">R$ 0,00</b></div></div>
<div class="toolbar"><button class="primary" onclick="openOrder('sale')">+ Venda</button><button onclick="openOrder('buy')">+ Compra</button></div>
<div class="box"><div class="rowtop"><b>Últimos pedidos</b><button style="padding:6px 8px;font-size:11px" onclick="pullCloud(true)">Sincronizar</button></div><div id="recent" class="list" style="margin-top:10px"></div></div>
<div class="toolbar"><button onclick="logout()">Sair da conta</button></div>
</section>
<section id="sales" class="page"><div class="toolbar"><button class="primary" onclick="openOrder('sale')">+ Nova venda</button></div><div id="salesList" class="list"></div></section>
<section id="buys" class="page"><div class="toolbar"><button class="primary" onclick="openOrder('buy')">+ Nova compra</button></div><div id="buyList" class="list"></div></section>
<section id="products" class="page"><div class="toolbar"><button class="primary" onclick="openProduct()">+ Produto</button></div><div id="productsList" class="list"></div></section>
<section id="customers" class="page"><div class="toolbar"><button class="primary" onclick="openCustomer()">+ Cliente</button></div><div id="customersList" class="list"></div></section>
<section id="suppliers" class="page"><div class="toolbar"><button class="primary" onclick="openSupplier()">+ Fornecedor</button></div><div id="suppliersList" class="list"></div></section>
</main>
<nav class="nav"><button class="on" data-p="dash">Painel</button><button data-p="sales">Vendas</button><button data-p="buys">Compras</button><button data-p="products">Produtos</button><button data-p="customers">Clientes</button><button data-p="suppliers">Fornec.</button></nav>

<div id="auth" class="auth on"><div class="authcard"><div class="authlogo">G</div><h2>Gestão Simples</h2><p>Entre com a mesma conta no iPhone e no notebook para manter tudo sincronizado.</p><div class="grid"><label>E-mail<input id="authEmail" type="email" autocomplete="email"></label><label>Senha<input id="authPass" type="password" autocomplete="current-password" minlength="6"></label></div><div id="authMsg" class="authmsg"></div><div class="authactions"><button onclick="signup()">Criar conta</button><button class="primary" onclick="login()">Entrar</button></div></div></div>

<div id="orderModal" class="modal"><div class="sheet"><h2 id="orderTitle">Pedido</h2><div class="grid grid2"><label>Data<input id="oDate" type="date"></label><label id="partyLabel">Cliente<select id="oParty"></select></label><label>Pagamento<select id="oPay"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Conta do cliente</option><option>Outro</option></select></label><label>Status<select id="oStatus"><option value="paid">Pago</option><option value="pending">Pendente</option></select></label><label id="fulfillLabel">Entrega/retirada<select id="oFulfill" onchange="toggleAddress()"><option value="pickup">Retirada</option><option value="delivery">Entrega</option></select></label><label id="addressLabel" style="display:none">Endereço<input id="oAddress"></label></div><div class="items" id="oItems"></div><button onclick="addItem()">+ Adicionar item</button><div class="row" style="margin-top:10px"><div class="rowtop"><b>Total</b><b id="oTotal" class="g">R$ 0,00</b></div></div><label style="display:block;margin-top:10px">Observações<textarea id="oNotes"></textarea></label><div class="sheetfoot"><button onclick="closeModal('orderModal')">Cancelar</button><button class="primary" onclick="saveOrder()">Salvar</button></div></div></div>

<div id="simpleModal" class="modal"><div class="sheet"><h2 id="simpleTitle"></h2><form id="simpleForm" class="grid"></form><div class="sheetfoot"><button onclick="closeModal('simpleModal')">Cancelar</button><button class="primary" onclick="saveSimple()">Salvar</button></div></div></div>

<script src="app.js"></script>
</body></html>
