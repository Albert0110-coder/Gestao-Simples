<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Gestão Simples"><title>Gestão Simples</title><style>:root{--b:#090d12;--p:#111821;--p2:#17212c;--l:#263341;--t:#eef4f8;--m:#91a2b2;--g:#5ee0a0;--r:#ff6b7a;--y:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:84px}header{position:sticky;top:0;z-index:5;background:#0d131bed;border-bottom:1px solid var(--l);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;backdrop-filter:blur(14px)}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--m);margin-top:3px}main{padding:16px;max-width:850px;margin:auto}.page{display:none}.page.on{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.box{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:14px}.card small{color:var(--m)}.card b{display:block;font-size:20px;margin-top:6px}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}button,input,select,textarea{font:inherit}button{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:11px;padding:11px 13px;font-weight:700}.primary{background:var(--g);color:#062017;border-color:var(--g)}.danger{color:#ffdce1;background:#27151b}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button{flex:1}.list{display:grid;gap:9px}.row{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:12px}.rowtop{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--m);font-size:12px}.total{font-weight:800}.pill{font-size:10px;border:1px solid var(--l);border-radius:999px;padding:4px 7px}.empty{text-align:center;color:var(--m);padding:26px}.modal{position:fixed;inset:0;display:none;z-index:20;background:#000b;align-items:flex-end}.modal.on{display:flex}.sheet{background:var(--p);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--l);padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 14px}.grid{display:grid;gap:10px}.grid2{grid-template-columns:1fr 1fr}label{font-size:11px;color:var(--m);font-weight:700}input,select,textarea{width:100%;margin-top:5px;background:#0d141c;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:11px}textarea{min-height:72px}.items{display:grid;gap:8px;margin:12px 0}.item{border:1px solid var(--l);border-radius:12px;padding:10px}.itemgrid{display:grid;grid-template-columns:1fr 90px;gap:8px}.item-actions{display:flex;gap:8px;margin-top:8px}.item-actions button{padding:7px 9px;font-size:12px}.sheetfoot{position:sticky;bottom:0;background:var(--p);padding-top:12px;display:flex;gap:8px}.sheetfoot button{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);background:#0d131bf2;border-top:1px solid var(--l);padding:7px 5px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{border:0;background:transparent;padding:8px 2px;font-size:10px;color:var(--m)}.nav button.on{color:var(--g)}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}.sheet{max-width:700px;margin:auto;border-radius:20px;margin-bottom:20px}.modal{align-items:center}.nav{left:50%;transform:translateX(-50%);max-width:700px;border:1px solid var(--l);border-radius:16px 16px 0 0}}</style></head><body><header><h1 id="pageTitle">Painel</h1><div class="sub">Gestão simples, direto no iPhone</div></header><main><section id="dash" class="page on"><div class="cards"><div class="card"><small>Vendas</small><b class="g" id="kSales">R$ 0,00</b></div><div class="card"><small>Compras</small><b class="r" id="kBuy">R$ 0,00</b></div><div class="card"><small>Resultado</small><b id="kResult">R$ 0,00</b></div><div class="card"><small>Pendências</small><b class="y" id="kPending">R$ 0,00</b></div></div><div class="toolbar"><button class="primary" onclick="openOrder('sale')">+ Venda</button><button onclick="openOrder('buy')">+ Compra</button></div><div class="box"><b>Últimos pedidos</b><div id="recent" class="list" style="margin-top:10px"></div></div></section><section id="sales" class="page"><div class="toolbar"><button class="primary" onclick="openOrder('sale')">+ Nova venda</button></div><div id="salesList" class="list"></div></section><section id="buys" class="page"><div class="toolbar"><button class="primary" onclick="openOrder('buy')">+ Nova compra</button></div><div id="buyList" class="list"></div></section><section id="products" class="page"><div class="toolbar"><button class="primary" onclick="openProduct()">+ Produto</button></div><div id="productsList" class="list"></div></section><section id="customers" class="page"><div class="toolbar"><button class="primary" onclick="openCustomer()">+ Cliente</button></div><div id="customersList" class="list"></div></section><section id="suppliers" class="page"><div class="toolbar"><button class="primary" onclick="openSupplier()">+ Fornecedor</button></div><div id="suppliersList" class="list"></div></section></main><nav class="nav"><button class="on" data-p="dash">Painel</button><button data-p="sales">Vendas</button><button data-p="buys">Compras</button><button data-p="products">Produtos</button><button data-p="customers">Clientes</button><button data-p="suppliers">Fornec.</button></nav><div id="orderModal" class="modal"><div class="sheet"><h2 id="orderTitle">Pedido</h2><div class="grid grid2"><label>Data<input id="oDate" type="date"></label><label id="partyLabel">Cliente<select id="oParty"></select></label><label>Pagamento<select id="oPay"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Conta do cliente</option><option>Outro</option></select></label><label>Status<select id="oStatus"><option value="paid">Pago</option><option value="pending">Pendente</option></select></label><label id="fulfillLabel">Entrega/retirada<select id="oFulfill" onchange="toggleAddress()"><option value="pickup">Retirada</option><option value="delivery">Entrega</option></select></label><label id="addressLabel" style="display:none">Endereço<input id="oAddress"></label></div><div class="items" id="oItems"></div><button onclick="addItem()">+ Adicionar item</button><div class="row" style="margin-top:10px"><div class="rowtop"><b>Total</b><b id="oTotal" class="g">R$ 0,00</b></div></div><label style="display:block;margin-top:10px">Observações<textarea id="oNotes"></textarea></label><div class="sheetfoot"><button onclick="closeModal('orderModal')">Cancelar</button><button class="primary" onclick="saveOrder()">Salvar</button></div></div></div><div id="simpleModal" class="modal"><div class="sheet"><h2 id="simpleTitle"></h2><form id="simpleForm" class="grid"></form><div class="sheetfoot"><button onclick="closeModal('simpleModal')">Cancelar</button><button class="primary" onclick="saveSimple()">Salvar</button></div></div></div><script>const $=id=>document.getElementById(id),money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let db;try{db=JSON.parse(localStorage.getItem('gestaoMobileV1'))}catch{}db=db||{products:[],customers:[],suppliers:[],sales:[],buys:[]};const save=()=>{localStorage.setItem('gestaoMobileV1',JSON.stringify(db));render()};let orderType='sale',simpleType='',editId=null;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page,.nav button').forEach(x=>x.classList.remove('on'));$(b.dataset.p).classList.add('on');b.classList.add('on');$('pageTitle').textContent=b.textContent});const product=id=>db.products.find(x=>x.id===id),cust=id=>db.customers.find(x=>x.id===id),supp=id=>db.suppliers.find(x=>x.id===id),orderTotal=o=>(o.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0);function render(){const month=today().slice(0,7),sales=db.sales.filter(o=>o.date?.startsWith(month)),buys=db.buys.filter(o=>o.date?.startsWith(month)),sv=sales.reduce((s,o)=>s+orderTotal(o),0),bv=buys.reduce((s,o)=>s+orderTotal(o),0),pd=[...sales,...buys].filter(o=>o.status==='pending').reduce((s,o)=>s+orderTotal(o),0);$('kSales').textContent=money(sv);$('kBuy').textContent=money(bv);$('kResult').textContent=money(sv-bv);$('kPending').textContent=money(pd);const row=(o,t)=>`<div class="row"><div class="rowtop"><div><b>${esc(t==='sale'?(cust(o.party)?.name||'Venda'):(supp(o.party)?.name||'Compra'))}</b><div class="muted">${esc(o.date||'')} · ${(o.items||[]).length} item(ns)</div></div><div style="text-align:right"><div class="total">${money(orderTotal(o))}</div><span class="pill">${o.status==='paid'?'Pago':'Pendente'}</span></div></div>${t==='sale'?`<div class="toolbar"><button onclick="receipt('${o.id}','receipt')">Recibo</button><button onclick="receipt('${o.id}','quote')">Orçamento</button></div>`:''}</div>`;const rs=[...db.sales.map(o=>({...o,_t:'sale'})),...db.buys.map(o=>({...o,_t:'buy'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);$('recent').innerHTML=rs.length?rs.map(o=>row(o,o._t)).join(''):'<div class="empty">Nenhum pedido ainda.</div>';$('salesList').innerHTML=db.sales.length?db.sales.slice().reverse().map(o=>row(o,'sale')).join(''):'<div class="empty">Nenhuma venda.</div>';$('buyList').innerHTML=db.buys.length?db.buys.slice().reverse().map(o=>row(o,'buy')).join(''):'<div class="empty">Nenhuma compra.</div>';$('productsList').innerHTML=db.products.length?db.products.map(p=>`<div class="row"><div class="rowtop"><div><b>${esc(p.name)}</b><div class="muted">Marca: ${esc(p.brand||'-')}</div></div><div class="total">${money(p.price)}</div></div><div class="toolbar"><button onclick="openProduct('${p.id}')">Editar</button><button class="danger" onclick="del('products','${p.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum produto.</div>';$('customersList').innerHTML=db.customers.length?db.customers.map(c=>`<div class="row"><div class="rowtop"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'')}</div></div><div class="total ${(+c.balance||0)>0?'y':'g'}">${money(c.balance)}</div></div><div class="toolbar"><button onclick="openCustomer('${c.id}')">Editar</button><button class="danger" onclick="del('customers','${c.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum cliente.</div>';$('suppliersList').innerHTML=db.suppliers.length?db.suppliers.map(s=>`<div class="row"><b>${esc(s.name)}</b><div class="muted">${esc(s.phone||'')}</div><div class="toolbar"><button onclick="openSupplier('${s.id}')">Editar</button><button class="danger" onclick="del('suppliers','${s.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum fornecedor.</div>'}function closeModal(id){$(id).classList.remove('on')}function openOrder(t){orderType=t;$('orderTitle').textContent=t==='sale'?'Nova venda':'Nova compra';$('partyLabel').firstChild.nodeValue=t==='sale'?'Cliente':'Fornecedor';$('fulfillLabel').style.display=t==='sale'?'block':'none';$('addressLabel').style.display='none';$('oParty').innerHTML='<option value="">Selecione...</option>'+(t==='sale'?db.customers:db.suppliers).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('oDate').value=today();$('oPay').value='Pix';$('oStatus').value='paid';$('oNotes').value='';$('oItems').innerHTML='';addItem();$('orderModal').classList.add('on')}function toggleAddress(){$('addressLabel').style.display=$('oFulfill').value==='delivery'?'block':'none'}function addItem(){const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="itemgrid"><label>Produto<select class="ip">${'<option value="">Selecione...</option>'+db.products.map(p=>`<option value="${p.id}">${esc(p.name)}${p.brand?' — '+esc(p.brand):''}</option>`).join('')}</select></label><label>Qtd.<input class="iq" type="number" min="0.01" step="0.01" value="1"></label><label>Preço<input class="iv" type="number" min="0" step="0.01" value="0"></label><div class="item-actions"><button type="button" onclick="this.closest('.item').remove();calcOrder()">Remover</button></div></div>`;d.querySelector('.ip').onchange=e=>{const p=product(e.target.value);d.querySelector('.iv').value=orderType==='sale'?(p?.price||0):(p?.cost||0);calcOrder()};d.querySelectorAll('input').forEach(i=>i.oninput=calcOrder);$('oItems').appendChild(d);calcOrder()}function calcOrder(){let n=0;document.querySelectorAll('#oItems .item').forEach(d=>n+=(+d.querySelector('.iq').value||0)*(+d.querySelector('.iv').value||0));$('oTotal').textContent=money(n)}function saveOrder(){const items=[...document.querySelectorAll('#oItems .item')].map(d=>({productId:d.querySelector('.ip').value,qty:+d.querySelector('.iq').value||0,price:+d.querySelector('.iv').value||0})).filter(i=>i.productId&&i.qty>0);if(!items.length)return alert('Adicione pelo menos um item.');if(!$('oParty').value)return alert(orderType==='sale'?'Selecione um cliente.':'Selecione um fornecedor.');const o={id:uid(),date:$('oDate').value,party:$('oParty').value,payment:$('oPay').value,status:$('oStatus').value,fulfillment:orderType==='sale'?$('oFulfill').value:'',address:$('oAddress').value,notes:$('oNotes').value,items};(orderType==='sale'?db.sales:db.buys).push(o);if(orderType==='sale'&&o.payment==='Conta do cliente'&&o.status==='pending'){const c=cust(o.party);if(c)c.balance=(+c.balance||0)+orderTotal(o)}save();closeModal('orderModal')}function simpleForm(type,obj={}){if(type==='product')return `<label>Produto<input name="name" required value="${esc(obj.name||'')}"></label><label>Marca<input name="brand" value="${esc(obj.brand||'')}"></label><div class="grid grid2"><label>Custo<input name="cost" type="number" step="0.01" value="${obj.cost||0}"></label><label>Preço de venda<input name="price" type="number" step="0.01" value="${obj.price||0}"></label></div>`;if(type==='customer')return `<label>Nome<input name="name" required value="${esc(obj.name||'')}"></label><label>Telefone<input name="phone" value="${esc(obj.phone||'')}"></label><label>Endereço<input name="address" value="${esc(obj.address||'')}"></label><label>Saldo em conta<input name="balance" type="number" step="0.01" value="${obj.balance||0}"></label>`;return `<label>Nome<input name="name" required value="${esc(obj.name||'')}"></label><label>Telefone<input name="phone" value="${esc(obj.phone||'')}"></label><label>Endereço<input name="address" value="${esc(obj.address||'')}"></label>`}function openProduct(id=''){openSimple('product',id)}function openCustomer(id=''){openSimple('customer',id)}function openSupplier(id=''){openSimple('supplier',id)}function openSimple(t,id){simpleType=t;editId=id;const arr=t==='product'?db.products:t==='customer'?db.customers:db.suppliers,obj=arr.find(x=>x.id===id)||{};$('simpleTitle').textContent=(id?'Editar ':'Novo ')+(t==='product'?'produto':t==='customer'?'cliente':'fornecedor');$('simpleForm').innerHTML=simpleForm(t,obj);$('simpleModal').classList.add('on')}function saveSimple(){const f=new FormData($('simpleForm')),obj={id:editId||uid(),name:f.get('name')||'',phone:f.get('phone')||'',address:f.get('address')||''};let arr;if(simpleType==='product'){arr=db.products;obj.brand=f.get('brand')||'';obj.cost=+f.get('cost')||0;obj.price=+f.get('price')||0}else if(simpleType==='customer'){arr=db.customers;obj.balance=+f.get('balance')||0}else arr=db.suppliers;if(!obj.name)return alert('Informe o nome.');const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);save();closeModal('simpleModal')}function del(k,id){if(!confirm('Excluir este cadastro?'))return;db[k]=db[k].filter(x=>x.id!==id);save()}function receipt(id,kind){const o=db.sales.find(x=>x.id===id),c=cust(o.party);if(!o)return;const title=kind==='quote'?'ORÇAMENTO':'RECIBO / PEDIDO',items=o.items.map(i=>{const p=product(i.productId);return `<tr><td>${esc(p?.name||'Item')}</td><td>${esc(p?.brand||'')}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`}).join(''),html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${title}</title><style>body{font-family:Arial;padding:22px;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid #ddd;text-align:left}.right{text-align:right}button{padding:10px;margin-bottom:16px}</style></head><body><button onclick="print()">Imprimir / Salvar PDF</button><h2>${title}</h2><p><b>Cliente:</b> ${esc(c?.name||'')}<br><b>Data:</b> ${esc(o.date)}<br><b>${o.fulfillment==='delivery'?'Entrega':'Retirada'}</b>${o.fulfillment==='delivery'?' — '+esc(o.address||c?.address||''):''}</p><table><tr><th>Item</th><th>Marca</th><th>Qtd.</th><th>Unit.</th><th>Total</th></tr>${items}</table><h2 class="right">Total: ${money(orderTotal(o))}</h2><p>${esc(o.notes||'')}</p></body></html>`;const w=open('','_blank');if(!w)return alert('Permita pop-ups no Safari para gerar o documento.');w.document.write(html);w.document.close()}render();</script></body></html>
